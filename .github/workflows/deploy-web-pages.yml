name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web-pages.yml"

env:
  CONTENT_URL: https://script.google.com/macros/s/AKfycbxSpFlw58q42sCEFS5ItNu-jME7OBuycRm-Ffm7lcpIlUprVN-OP_dhwODyzlqJ9c-Y/exec

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (GitHub Pages base path)
        run: >
          flutter build web --release
          --base-href "/JSPEAK/"
          --dart-define=CONTENT_URL=${{ env.CONTENT_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
